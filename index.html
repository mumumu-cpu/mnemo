<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mnemo" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Mnemo</title>
    <style>
      html,body{margin:0;background:#f7f8fc}
      #splash{position:fixed;inset:0;display:grid;place-items:center;z-index:100;background:#f7f8fc;transition:opacity .45s ease,visibility .45s}
      #splash.out{opacity:0;visibility:hidden}
      #splash .orb{width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,#7aa7ff,#b28dff 55%,#ffb3c7);box-shadow:0 12px 40px rgba(122,120,255,.35),inset 0 2px 0 rgba(255,255,255,.7);animation:breathe 1.4s ease-in-out infinite}
      @keyframes breathe{0%,100%{transform:scale(.92);filter:saturate(1)}50%{transform:scale(1.04);filter:saturate(1.3)}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="orb"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
